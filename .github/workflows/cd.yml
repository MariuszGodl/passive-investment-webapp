name: CD

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # imagetools copies the whole multi-arch manifest (docker pull/tag/push would keep only one arch)
      - name: Shift current image to prev
        run: |
          docker buildx imagetools create \
            -t godlewskimariusz/passive-investment-webapp:prev \
            godlewskimariusz/passive-investment-webapp:current || true

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: godlewskimariusz/passive-investment-webapp
          tags: |
            type=raw,value=current
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.passive-investment-app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

    outputs:
      digest: ${{ steps.build.outputs.digest }}

  deploy-oci:
    name: Deploy to Oracle Cloud (k3s)
    needs: build-and-push
    runs-on: ubuntu-latest
    # Skipped until the OCI_HOST repository variable is configured
    if: ${{ vars.OCI_HOST != '' }}
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.OCI_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/oci_key
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/oci_key ~/.ssh/known_hosts

      - name: Deploy new image
        env:
          OCI_HOST: ${{ vars.OCI_HOST }}
          OCI_USER: ${{ vars.OCI_USER || 'ubuntu' }}
          IMAGE: godlewskimariusz/passive-investment-webapp@${{ needs.build-and-push.outputs.digest }}
        run: |
          ssh -i ~/.ssh/oci_key "$OCI_USER@$OCI_HOST" \
            "~/passive-investment-webapp/scripts/oci_k3s_deploy.sh $IMAGE"
