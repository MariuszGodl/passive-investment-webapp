name: CD

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # imagetools copies the whole multi-arch manifest (docker pull/tag/push would keep only one arch)
      - name: Shift current image to prev
        run: |
          docker buildx imagetools create \
            -t godlewskimariusz/passive-investment-webapp:prev \
            godlewskimariusz/passive-investment-webapp:current || true

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: godlewskimariusz/passive-investment-webapp
          tags: |
            type=raw,value=current
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.passive-investment-app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
