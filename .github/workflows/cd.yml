name: CD

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Shift current image to prev
        run: |
          docker pull godlewskimariusz/passive-investment-webapp:current || true
          docker tag godlewskimariusz/passive-investment-webapp:current godlewskimariusz/passive-investment-webapp:prev || true
          docker push godlewskimariusz/passive-investment-webapp:prev || true

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: godlewskimariusz/passive-investment-webapp
          tags: |
            type=raw,value=current
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.passive-investment-app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
