<nav class="fixed top-0 w-full z-50 bg-white/80 backdrop-blur-xl shadow-sm border-b border-outline-variant/15">
    <div class="flex justify-between items-center h-20 px-8 w-full max-w-screen-2xl mx-auto">
        <!-- Logo -->
        <a href="{{ url_for('invest_page') }}" class="text-2xl font-bold tracking-tight text-primary font-headline">
            SafeVesting
        </a>

        <!-- Navigation -->
        <div class="hidden md:flex items-center space-x-8">
            {% set logged_in = 1 if user else 0 %}

            {% if request.path == "/" %}
                <button
                    type="button"
                    class="text-primary font-semibold border-b-2 border-primary pb-1 text-sm font-label"
                    onclick="event.preventDefault(); navBarRouting(event, this, 1, '/')"
                >
                    Invest
                </button>
            {% else %}
                <button
                    type="button"
                    class="text-slate-500 hover:text-primary transition-colors text-sm font-label"
                    onclick="event.preventDefault(); navBarRouting(event, this, 1, '/')"
                >
                    Invest
                </button>
            {% endif %}

            {% if request.path == "/favorites" %}
                <button
                    type="button"
                    class="text-primary font-semibold border-b-2 border-primary pb-1 text-sm font-label"
                    onclick="event.preventDefault(); navBarRouting(event, this, {{ logged_in }}, '/favorites')"
                >
                    Favorites
                </button>
            {% else %}
                <button
                    type="button"
                    class="text-slate-500 hover:text-primary transition-colors text-sm font-label"
                    onclick="event.preventDefault(); navBarRouting(event, this, {{ logged_in }}, '/favorites')"
                >
                    Favorites
                </button>
            {% endif %}

            {% if request.path == "/my_investments" %}
                <button
                    type="button"
                    class="text-primary font-semibold border-b-2 border-primary pb-1 text-sm font-label"
                    onclick="event.preventDefault(); navBarRouting(event, this, {{ logged_in }}, '/my_investments')"
                >
                    My investments
                </button>
            {% else %}
                <button
                    type="button"
                    class="text-slate-500 hover:text-primary transition-colors text-sm font-label"
                    onclick="event.preventDefault(); navBarRouting(event, this, {{ logged_in }}, '/my_investments')"
                >
                    My investments
                </button>
            {% endif %}
        </div>

        <!-- Profile -->
        <div class="flex items-center space-x-4">
            <!-- Menu -->
            <div class="relative group/menu">
                {% if user == None %}
                <button
                    aria-label="Open menu"
                    class="p-2 hover:bg-slate-100 rounded-full transition-colors ml-2"
                >
                    <div class="text-right hidden sm:block">
                        <a
                            href="{{ url_for('login') }}"
                            class="text-sm font-semibold text-on-surface"
                        >
                            Log in
                        </a>
                    </div>
                </button>

                {% else %}
                <button aria-label="Open menu" class="p-2 hover:bg-slate-100 rounded-full transition-colors ml-2">
                    <div class="text-right hidden sm:block">
                        <p class="text-sm font-semibold text-on-surface">{{user.full_name}}</p>
                    </div>
                </button>
                <div
                    class="absolute right-0 top-full mt-2 w-56 bg-white rounded-xl shadow-xl border border-outline-variant/10 py-2 opacity-0 invisible group-hover/menu:opacity-100 group-hover/menu:visible transition-all duration-200 z-50 transform origin-top-right scale-95 group-hover/menu:scale-100"
                >
                    <a
                        href="#"
                        class="block px-4 py-3 text-sm font-medium text-slate-700 hover:bg-primary/5 hover:text-primary"
                    >
                        Account settings
                    </a>

                    <a
                        href="{{ url_for('invest_page') }}"
                        class="block px-4 py-3 text-sm font-medium text-slate-700 hover:bg-primary/5 hover:text-primary"
                    >
                        Log out
                    </a>
                </div>
                {% endif %}
            </div>
        </div>
    </div>
</nav>

<script src="{{ url_for('static', path='js/main.js') }}"></script>
