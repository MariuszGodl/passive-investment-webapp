services:
  adminer:
    image: adminer
    container_name: passive-investment-adminer
    restart: unless-stopped
    ports:
      - "8888:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db

  data-loader:
    build:
      context: .
      dockerfile: docker/Dockerfile.passive-investment-app
    container_name: passive-investment-data-loader
    depends_on:
      - db
    environment:
      DATABASE_URL: "postgresql+psycopg2://app:app@db:5432/passive_investment"
    volumes:
      - .:/app
    entrypoint: ["uv", "run", "python", "scripts/init_dev_db.py"]
